<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>术力口电台</title>
  <meta name="description" content="术力口电台：VOCALOID 歌曲播放器，带滚动歌词、歌单与点赞。">
  <meta name="theme-color" content="#39c5bb">
  <meta property="og:title" content="术力口电台">
  <meta property="og:description" content="VOCALOID 歌曲播放器，带滚动歌词与点赞。">
  <meta property="og:type" content="website">
  <link rel="icon" type="image/png" href="./cover/default.png">
  <link rel="stylesheet" href="./assets/style.css">
</head>
<body>
  <a class="skip-link" href="#playerControls">跳到播放控件</a>

  <!-- 背景层：当前封面的低清缩略图 + 模糊。深浅主题共用同一张背景，切换主题不改变它 -->
  <div class="ambient" aria-hidden="true">
    <img id="ambientImg" class="ambient__image" src="./cover/default.png" alt="" decoding="async">
    <div class="ambient__scrim"></div>
  </div>

  <div class="shell">
    <header class="topbar card card--glass">
      <a class="topbar__back" href="https://yunjiutong.cn/" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M14.7 5.3a1 1 0 0 1 0 1.4L9.4 12l5.3 5.3a1 1 0 1 1-1.4 1.4l-6-6a1 1 0 0 1 0-1.4l6-6a1 1 0 0 1 1.4 0z"/></svg>
        <span>玖桐博客</span>
      </a>

      <h1 class="topbar__brand">术力口电台</h1>

      <button id="theme" class="chip" type="button" aria-pressed="false" aria-label="切换到深色主题">
        <svg class="chip__icon chip__icon--moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg>
        <svg class="chip__icon chip__icon--sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4.2"/><path d="M11 1.6h2v2.6h-2zM11 19.8h2v2.6h-2zM1.6 11h2.6v2H1.6zM19.8 11h2.6v2h-2.6zM4.4 5.8l1.4-1.4 1.9 1.9-1.4 1.4zM16.3 17.7l1.4-1.4 1.9 1.9-1.4 1.4zM17.7 4.4l1.4 1.4-1.9 1.9-1.4-1.4zM5.8 16.3l1.4 1.4-1.9 1.9-1.4-1.4z"/></svg>
        <span id="themeLabel" class="chip__text">深色</span>
      </button>
    </header>

    <main class="stage">
      <section class="card lyrics" aria-labelledby="lyricHeading">
        <div class="card__head">
          <h2 class="card__heading" id="lyricHeading">歌词</h2>
          <p class="card__count" id="nowIndex">正在载入…</p>
        </div>
        <div class="lyrics__scroll" id="lyricBox" tabindex="0" role="region" aria-label="歌词，可上下滚动">
          <div id="lyricWrap" class="lyrics__inner">
            <p class="lyrics__placeholder">正在载入歌词…</p>
          </div>
        </div>
      </section>
    </main>
  </div>

  <footer class="player card card--glass" id="player" aria-label="播放器">
    <img id="coverImg" class="player__cover" src="./cover/default.png" alt="当前歌曲封面" crossorigin="anonymous">
    <div class="player__meta">
      <h2 class="player__title" id="songTitle">—</h2>
      <p class="player__artist" id="songArtist">—</p>
    </div>
    <button class="btn btn--pill btn--queue" id="queueToggle" type="button"
            aria-expanded="false" aria-controls="queuePanel">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 6a1 1 0 0 1 1-1h9a1 1 0 1 1 0 2H5a1 1 0 0 1-1-1zm0 5a1 1 0 0 1 1-1h9a1 1 0 1 1 0 2H5a1 1 0 0 1-1-1zm0 5a1 1 0 0 1 1-1h5a1 1 0 1 1 0 2H5a1 1 0 0 1-1-1zm14.7-6.3a1 1 0 0 1 1.4 1.4l-2.1 2.1a1 1 0 0 1-1.4 0l-1.1-1.1a1 1 0 0 1 1.4-1.4l.4.4 1.4-1.4z"/></svg>
      <span>歌单</span>
    </button>

    <!-- 歌单：点「歌单」按钮从播放器卡片上方展开。
         放在触发按钮之后，Tab 顺序才是 按钮 → 面板项目 → 进度条 → 控制键 -->
    <div class="queue">
      <div class="queue__panel" id="queuePanel">
        <div class="queue__head">
          <h2 class="queue__title" id="queueHeading">歌单</h2>
          <span class="queue__hint" id="listCount">0 首</span>
          <button class="queue__close" id="queueClose" type="button" aria-label="收起歌单">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6.4 5A1 1 0 0 0 5 6.4L10.6 12 5 17.6A1 1 0 1 0 6.4 19l5.6-5.6 5.6 5.6a1 1 0 1 0 1.4-1.4L13.4 12 19 6.4A1 1 0 1 0 17.6 5L12 10.6 6.4 5z"/></svg>
          </button>
        </div>
        <div class="queue__scroll" id="queueScroll">
          <ol class="list__items" id="playlistList" aria-labelledby="queueHeading"></ol>
        </div>
      </div>
    </div>

    <div class="player__progress">
      <label class="sr-only" for="seek">播放进度</label>
      <span class="player__time" id="timeNow">0:00</span>
      <input class="seek" id="seek" type="range" min="0" max="1000" step="1" value="0" aria-describedby="timeNow timeTotal">
      <span class="player__time" id="timeTotal">0:00</span>
    </div>

    <div class="player__row" id="playerControls" tabindex="-1">
      <div class="player__group">
        <button class="btn btn--round" id="btnPrev" type="button" aria-label="上一首">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M7 6a1 1 0 0 1 2 0v12a1 1 0 1 1-2 0V6zm10.3 1.2a1 1 0 0 1 .7.95v7.7a1 1 0 0 1-1.55.83l-5.7-3.85a1 1 0 0 1 0-1.66l5.7-3.85a1 1 0 0 1 .85-.12z"/></svg>
        </button>
        <button class="btn btn--play" id="btnPlay" type="button" aria-label="播放">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M8 5.14v13.72a1 1 0 0 0 1.52.85l10.5-6.86a1 1 0 0 0 0-1.7L9.52 4.3A1 1 0 0 0 8 5.14z"/></svg>
        </button>
        <button class="btn btn--round" id="btnNext" type="button" aria-label="下一首">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M17 6a1 1 0 0 1 2 0v12a1 1 0 1 1-2 0V6zM6.7 7.2a1 1 0 0 1 1.55-.83l5.7 3.85a1 1 0 0 1 0 1.66l-5.7 3.85a1 1 0 0 1-1.55-.83V7.2z"/></svg>
        </button>
      </div>

      <div class="player__group player__group--end">
        <button class="btn btn--pill" id="btnLike" type="button" aria-label="为这首歌点赞">
          <svg class="btn__heart" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 20.7l-1.3-1.2C6.1 15.4 3 12.5 3 9.1 3 6.3 5.2 4 8 4c1.6 0 3.1.7 4 1.9C12.9 4.7 14.4 4 16 4c2.8 0 5 2.3 5 5.1 0 3.4-3.1 6.3-7.7 10.4L12 20.7z"/></svg>
          <span class="btn__count" id="likeCountText">0</span>
        </button>

        <div class="volume" id="volumeControl">
          <button class="btn btn--round" id="btnMute" type="button" aria-label="音量" aria-expanded="false" aria-controls="volumePopover">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 9a1 1 0 0 1 1-1h2.6l3.9-3.4A1 1 0 0 1 13 5.3v13.4a1 1 0 0 1-1.5.7L7.6 16H5a1 1 0 0 1-1-1V9zm11.5 3a3.5 3.5 0 0 0-1.5-2.9v5.8a3.5 3.5 0 0 0 1.5-2.9zm-1.5-7v2.2A5.9 5.9 0 0 1 18 12a5.9 5.9 0 0 1-4 5.8V20a8 8 0 0 0 6-8 8 8 0 0 0-6-8z"/></svg>
          </button>
          <div class="volume__menu" id="volumePopover" role="group" aria-label="音量调节">
            <label class="sr-only" for="volumeSlider">音量</label>
            <input class="seek seek--sm" id="volumeSlider" type="range" min="0" max="100" step="1" value="80">
            <span class="volume__text" id="volumeText">80%</span>
          </div>
        </div>
      </div>
    </div>
  </footer>

  <audio id="audioPlayer" preload="metadata" crossorigin="anonymous" playsinline></audio>
  <script src="./color-thief.min.js"></script>
  <script src="./assets/main.js"></script>
</body>
</html>
